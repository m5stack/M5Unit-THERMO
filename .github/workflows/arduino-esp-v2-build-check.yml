name: Build(arduino-esp32:2.x)

env:
  SKETCH_NAMES_FIND_START: ./examples/UnitUnified
  REQUIRED_LIBRARIES: M5Unified,M5UnitUnified,M5Unit-HUB

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/arduino-esp-v2-build-check.yml'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/arduino-esp-v2-build-check.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.unit }}:${{ matrix.sketch }}:${{matrix.board}}@${{matrix.platform-version}}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        platform-url:
          - https://espressif.github.io/arduino-esp32/package_esp32_index.json

        # Every unit is I2C (addI2C); each unit's own code is built on every representative board
        unit:
          - UnitNCIR
          - UnitNCIR2
          - UnitThermal2

        sketch:
          - PlotToSerial

        board:
          # Reduced from 7 to 2 boards: ESP32 and ESP32-S3 (core 2.0.x has no C6 / H2 / P4).
          # The other boards differ only in the variant header, so the library code compiles the same.
#          - m5stack-atom  # ESP32: represented by m5stack-core-esp32
#          - m5stack-atoms3  # ESP32-S3: represented by m5stack-cores3
          - m5stack-core-esp32
#          - m5stack-core2  # ESP32: represented by m5stack-core-esp32
#          - m5stack-coreink  # ESP32: represented by m5stack-core-esp32
          - m5stack-cores3
#          - m5stack-fire  # ESP32: represented by m5stack-core-esp32

        platform-version:
          - 2.0.17

        platform:
          - esp32

        archi:
          - esp32

        include:
          # The display examples only add M5GFX drawing code on top of PlotToSerial, so they are built on Core only
          - {unit: UnitNCIR2, sketch: SimpleDisplay, board: m5stack-core-esp32, platform-url: 'https://espressif.github.io/arduino-esp32/package_esp32_index.json', platform-version: 2.0.17, platform: esp32, archi: esp32}
          - {unit: UnitThermal2, sketch: SimpleDisplay, board: m5stack-core-esp32, platform-url: 'https://espressif.github.io/arduino-esp32/package_esp32_index.json', platform-version: 2.0.17, platform: esp32, archi: esp32}
          - {unit: UnitThermal2, sketch: SmoothDraw, board: m5stack-core-esp32, platform-url: 'https://espressif.github.io/arduino-esp32/package_esp32_index.json', platform-version: 2.0.17, platform: esp32, archi: esp32}
          # ViaPaHub (NCIR / NCIR2 / Thermal2 via PaHub2) goes through UnitPaHub (M5Unit-HUB),
          # so it is built on every representative board
          - {sketch: ViaPaHub, board: m5stack-core-esp32, platform-url: 'https://espressif.github.io/arduino-esp32/package_esp32_index.json', platform-version: 2.0.17, platform: esp32, archi: esp32}
          - {sketch: ViaPaHub, board: m5stack-cores3, platform-url: 'https://espressif.github.io/arduino-esp32/package_esp32_index.json', platform-version: 2.0.17, platform: esp32, archi: esp32}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare libraries list
        id: libs
        run: |
          {
            echo "yaml<<EOF"
            echo "$REQUIRED_LIBRARIES" | tr ',' '\n' | while read -r lib; do
              echo "- name: $lib"
            done
            echo "- source-path: ./"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compile examples
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.platform }}:${{ matrix.archi }}:${{ matrix.board }}
          platforms: |
            - name: ${{ matrix.platform }}:${{ matrix.archi }}
              source-url: ${{ matrix.platform-url }}
              version: ${{ matrix.platform-version }}
          libraries: ${{ steps.libs.outputs.yaml }}
          sketch-paths: |
            - ${{ env.SKETCH_NAMES_FIND_START }}/${{ matrix.unit }}/${{ matrix.sketch }}
