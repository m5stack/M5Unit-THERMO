name: Build(arduino-m5stack)

env:
  SKETCH_NAMES_FIND_START: ./examples/UnitUnified
  REQUIRED_LIBRARIES: M5Unified,M5UnitUnified

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/arduino-m5-build-check.yml'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/arduino-m5-build-check.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.unit }}:${{ matrix.sketch }}:${{matrix.board}}@${{matrix.platform-version}}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        platform-url:
          - https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json

        sketch:
          - PlotToSerial
          - SimpleDisplay
          - SmoothDraw

        unit:
          - UnitNCIR
          - UnitNCIR2
          - UnitThermal2

        board:
          - arduino_nesso_n1
          - m5stack_atom
          - m5stack_atoms3
          - m5stack_atoms3r
          - m5stack_capsule
          - m5stack_cardputer
          - m5stack_core
          - m5stack_core2
          - m5stack_coreink
          - m5stack_cores3
          - m5stack_dial
          - m5stack_dinmeter
          - m5stack_fire
          - m5stack_nano_c6
          - m5stack_paper
          - m5stack_papers3
          - m5stack_stamp_s3
          - m5stack_stickc
          - m5stack_stickc_plus
          - m5stack_stickc_plus2
          - m5stack_sticks3
          - m5stack_tab5

        platform-version:
          - 3.2.5

        platform:
          - m5stack

        archi:
          - esp32

        exclude:
          # UnitNCIR has no SimpleDisplay/SmoothDraw examples
          - unit: UnitNCIR
            sketch: SimpleDisplay
          - unit: UnitNCIR
            sketch: SmoothDraw
          # UnitNCIR2 has no SmoothDraw example
          - unit: UnitNCIR2
            sketch: SmoothDraw
          # SimpleDisplay/SmoothDraw: Core only
          - board: arduino_nesso_n1
            sketch: SimpleDisplay
          - board: arduino_nesso_n1
            sketch: SmoothDraw
          - board: m5stack_atom
            sketch: SimpleDisplay
          - board: m5stack_atom
            sketch: SmoothDraw
          - board: m5stack_atoms3
            sketch: SimpleDisplay
          - board: m5stack_atoms3
            sketch: SmoothDraw
          - board: m5stack_atoms3r
            sketch: SimpleDisplay
          - board: m5stack_atoms3r
            sketch: SmoothDraw
          - board: m5stack_capsule
            sketch: SimpleDisplay
          - board: m5stack_capsule
            sketch: SmoothDraw
          - board: m5stack_cardputer
            sketch: SimpleDisplay
          - board: m5stack_cardputer
            sketch: SmoothDraw
          - board: m5stack_core2
            sketch: SimpleDisplay
          - board: m5stack_core2
            sketch: SmoothDraw
          - board: m5stack_coreink
            sketch: SimpleDisplay
          - board: m5stack_coreink
            sketch: SmoothDraw
          - board: m5stack_cores3
            sketch: SimpleDisplay
          - board: m5stack_cores3
            sketch: SmoothDraw
          - board: m5stack_dial
            sketch: SimpleDisplay
          - board: m5stack_dial
            sketch: SmoothDraw
          - board: m5stack_dinmeter
            sketch: SimpleDisplay
          - board: m5stack_dinmeter
            sketch: SmoothDraw
          - board: m5stack_fire
            sketch: SimpleDisplay
          - board: m5stack_fire
            sketch: SmoothDraw
          - board: m5stack_nano_c6
            sketch: SimpleDisplay
          - board: m5stack_nano_c6
            sketch: SmoothDraw
          - board: m5stack_paper
            sketch: SimpleDisplay
          - board: m5stack_paper
            sketch: SmoothDraw
          - board: m5stack_papers3
            sketch: SimpleDisplay
          - board: m5stack_papers3
            sketch: SmoothDraw
          - board: m5stack_stamp_s3
            sketch: SimpleDisplay
          - board: m5stack_stamp_s3
            sketch: SmoothDraw
          - board: m5stack_stickc
            sketch: SimpleDisplay
          - board: m5stack_stickc
            sketch: SmoothDraw
          - board: m5stack_stickc_plus
            sketch: SimpleDisplay
          - board: m5stack_stickc_plus
            sketch: SmoothDraw
          - board: m5stack_stickc_plus2
            sketch: SimpleDisplay
          - board: m5stack_stickc_plus2
            sketch: SmoothDraw
          - board: m5stack_sticks3
            sketch: SimpleDisplay
          - board: m5stack_sticks3
            sketch: SmoothDraw
          - board: m5stack_tab5
            sketch: SimpleDisplay
          - board: m5stack_tab5
            sketch: SmoothDraw

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare libraries list
        id: libs
        run: |
          {
            echo "yaml<<EOF"
            echo "$REQUIRED_LIBRARIES" | tr ',' '\n' | while read -r lib; do
              echo "- name: $lib"
            done
            echo "- source-path: ./"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compile examples
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.platform }}:${{ matrix.archi }}:${{ matrix.board }}
          platforms: |
            - name: ${{ matrix.platform }}:${{ matrix.archi }}
              source-url: ${{ matrix.platform-url }}
              version: ${{ matrix.platform-version }}
          libraries: ${{ steps.libs.outputs.yaml }}
          sketch-paths: |
            - ${{ env.SKETCH_NAMES_FIND_START }}/${{ matrix.unit }}/${{ matrix.sketch }}

