name: Build(platformio)

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
      - 'unit_ncir_env.ini'
      - 'unit_ncir2_env.ini'
      - 'unit_thermal2_env.ini'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
      - 'unit_ncir_env.ini'
      - 'unit_ncir2_env.ini'
      - 'unit_thermal2_env.ini'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.unit }}:${{ matrix.example }}@${{ matrix.board }}:${{ matrix.framework }}:${{ matrix.espressif32 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20
      
      matrix:
        example:
          - PlotToSerial
          - SimpleDisplay
          - SmoothDraw

        unit:
          - UnitNCIR
          - UnitNCIR2
          - UnitThermal2

        board:
          - Core
          - Core2
          - CoreS3
          - Fire
          - StampS3
          - Dial
          - Atom
          - AtomS3
          - AtomS3R
          - NanoC6
          - StickCPlus
          - StickCPlus2
          - StickS3
          - Paper
          - CoreInk
          - Cardputer
          - Tab5
          - NessoN1

        framework:
          - Arduino

        espressif32:
          - latest
#          - '5_4_0'
#          - '4_4_0'

#        exclude:
#          - board: CoreS3
#            espressif32: '5_4_0'
#          - board: CoreS3
#            espressif32: '4_4_0'
#          - board: StampS3
#            espressif32: '5_4_0'
#          - board: StampS3
#            espressif32: '4_4_0'
#          - board: AtomS3
#            espressif32: '5_4_0'
#          - board: AtomS3
#            espressif32: '4_4_0'
#          - board: Dial
#            espressif32: '5_4_0'
#          - board: Dial
#            espressif32: '4_4_0'
#          - board: NanoC6
#            espressif32: '5_4_0'
#          - board: NanoC6
#            espressif32: '4_4_0'
#          - board: StickCPlus
#            espressif32: '5_4_0'
#          - board: StickCPlus
#            espressif32: '4_4_0'
#          - board: Paper
#            espressif32: '5_4_0'
#          - board: Paper
#            espressif32: '4_4_0'

        exclude:
          # UnitNCIR has no SimpleDisplay/SmoothDraw examples
          - unit: UnitNCIR
            example: SimpleDisplay
          - unit: UnitNCIR
            example: SmoothDraw
          # UnitNCIR2 has no SmoothDraw example
          - unit: UnitNCIR2
            example: SmoothDraw
          # SimpleDisplay/SmoothDraw: Core only (env exists only for Core)
          - board: Core2
            example: SimpleDisplay
          - board: Core2
            example: SmoothDraw
          - board: CoreS3
            example: SimpleDisplay
          - board: CoreS3
            example: SmoothDraw
          - board: Fire
            example: SimpleDisplay
          - board: Fire
            example: SmoothDraw
          - board: StampS3
            example: SimpleDisplay
          - board: StampS3
            example: SmoothDraw
          - board: Dial
            example: SimpleDisplay
          - board: Dial
            example: SmoothDraw
          - board: Atom
            example: SimpleDisplay
          - board: Atom
            example: SmoothDraw
          - board: AtomS3
            example: SimpleDisplay
          - board: AtomS3
            example: SmoothDraw
          - board: AtomS3R
            example: SimpleDisplay
          - board: AtomS3R
            example: SmoothDraw
          - board: NanoC6
            example: SimpleDisplay
          - board: NanoC6
            example: SmoothDraw
          - board: StickCPlus
            example: SimpleDisplay
          - board: StickCPlus
            example: SmoothDraw
          - board: StickCPlus2
            example: SimpleDisplay
          - board: StickCPlus2
            example: SmoothDraw
          - board: StickS3
            example: SimpleDisplay
          - board: StickS3
            example: SmoothDraw
          - board: Paper
            example: SimpleDisplay
          - board: Paper
            example: SmoothDraw
          - board: CoreInk
            example: SimpleDisplay
          - board: CoreInk
            example: SmoothDraw
          - board: Cardputer
            example: SimpleDisplay
          - board: Cardputer
            example: SmoothDraw
          - board: Tab5
            example: SimpleDisplay
          - board: Tab5
            example: SmoothDraw
          - board: NessoN1
            example: SimpleDisplay
          - board: NessoN1
            example: SmoothDraw

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install intelhex
        run: pip install intelhex

      - name: Build examples
        uses: karniv00l/platformio-run-action@v1
        with:
          environments: ${{ matrix.unit != '' && format('{0}_{1}_{2}_{3}_{4}', matrix.unit, matrix.example, matrix.board, matrix.framework, matrix.espressif32) || format('{0}_{1}_{2}_{3}', matrix.example, matrix.board, matrix.framework, matrix.espressif32) }}
#         targets:
          project-dir: "./"
          project-conf: "./platformio.ini"
#          jobs: 6
#          silent: false
#          verbose: true
#          disable-auto-clean: false
