name: Build(platformio)

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
      - 'unit_ncir_env.ini'
      - 'unit_ncir2_env.ini'
      - 'unit_thermal2_env.ini'
      - 'via_pahub_env.ini'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
      - 'unit_ncir_env.ini'
      - 'unit_ncir2_env.ini'
      - 'unit_thermal2_env.ini'
      - 'via_pahub_env.ini'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.unit }}:${{ matrix.example }}@${{ matrix.board }}:${{ matrix.framework }}:${{ matrix.espressif32 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20
      
      matrix:
        # Every unit is I2C (addI2C); each unit's own code is built on every representative board
        unit:
          - UnitNCIR
          - UnitNCIR2
          - UnitThermal2

        example:
          - PlotToSerial

        board:
          # Reduced from 19 to 5 boards: one per compile config (chip arch x platform).
          # The other boards differ only in the variant header, so the library code compiles the same.
          - Core
#          - Core2  # ESP32: represented by Core
          - CoreS3
#          - Fire  # ESP32: represented by Core
#          - StampS3  # ESP32-S3: represented by CoreS3
#          - Dial  # ESP32-S3: represented by CoreS3
#          - Atom  # ESP32: represented by Core
#          - AtomS3  # ESP32-S3: represented by CoreS3
#          - AtomS3R  # ESP32-S3: represented by CoreS3
          - NanoC6
          - NanoH2
#          - StickCPlus  # ESP32: represented by Core
#          - StickCPlus2  # ESP32: represented by Core
#          - StickS3  # ESP32-S3: represented by CoreS3
#          - Paper  # ESP32: represented by Core
#          - CoreInk  # ESP32: represented by Core
#          - Cardputer  # ESP32-S3: represented by CoreS3
          - Tab5
#          - NessoN1  # ESP32-C6: represented by NanoC6

        framework:
          - Arduino

        espressif32:
          - latest

        include:
          # The display examples only add M5GFX drawing code on top of PlotToSerial; their envs exist for Core only
          - {unit: UnitNCIR2, example: SimpleDisplay, board: Core, framework: Arduino, espressif32: latest}
          - {unit: UnitThermal2, example: SimpleDisplay, board: Core, framework: Arduino, espressif32: latest}
          - {unit: UnitThermal2, example: SmoothDraw, board: Core, framework: Arduino, espressif32: latest}
          # ViaPaHub (NCIR / NCIR2 / Thermal2 via PaHub2) goes through UnitPaHub (M5Unit-HUB),
          # so it is built on every representative board
          - {example: ViaPaHub, board: Core, framework: Arduino, espressif32: latest}
          - {example: ViaPaHub, board: CoreS3, framework: Arduino, espressif32: latest}
          - {example: ViaPaHub, board: NanoC6, framework: Arduino, espressif32: latest}
          - {example: ViaPaHub, board: NanoH2, framework: Arduino, espressif32: latest}
          - {example: ViaPaHub, board: Tab5, framework: Arduino, espressif32: latest}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install intelhex
        run: pip install intelhex

      - name: Build examples
        uses: karniv00l/platformio-run-action@v1
        with:
          environments: ${{ matrix.unit != '' && format('{0}_{1}_{2}_{3}_{4}', matrix.unit, matrix.example, matrix.board, matrix.framework, matrix.espressif32) || format('{0}_{1}_{2}_{3}', matrix.example, matrix.board, matrix.framework, matrix.espressif32) }}
#         targets:
          project-dir: "./"
          project-conf: "./platformio.ini"
#          jobs: 6
#          silent: false
#          verbose: true
#          disable-auto-clean: false
