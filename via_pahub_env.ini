;-----------------------------------------------------------------------
; For ViaPaHub (UnitNCIR / UnitNCIR2 / UnitThermal2 via PaHub2)
; M5Unit-HUB is an example-only dependency (not a dependency of the library itself)
;-----------------------------------------------------------------------

[env:ViaPaHub_Core_Arduino_latest]
extends=Core, option_release, arduino_latest
build_src_filter = +<*> -<.git/> -<.svn/> +<../examples/UnitUnified/ViaPaHub>
lib_deps = ${Core.lib_deps}
  m5stack/M5Unit-HUB

[env:ViaPaHub_CoreS3_Arduino_latest]
extends=CoreS3, option_release, arduino_latest
build_src_filter = +<*> -<.git/> -<.svn/> +<../examples/UnitUnified/ViaPaHub>
lib_deps = ${CoreS3.lib_deps}
  m5stack/M5Unit-HUB

[env:ViaPaHub_NanoC6_Arduino_latest]
extends=NanoC6, option_release, pioarduino_latest
build_src_filter = +<*> -<.git/> -<.svn/> +<../examples/UnitUnified/ViaPaHub>
lib_deps = ${NanoC6.lib_deps}
  m5stack/M5Unit-HUB

[env:ViaPaHub_NanoH2_Arduino_latest]
extends=NanoH2, option_release, pioarduino_latest
build_src_filter = +<*> -<.git/> -<.svn/> +<../examples/UnitUnified/ViaPaHub>
lib_deps = ${NanoH2.lib_deps}
  m5stack/M5Unit-HUB

[env:ViaPaHub_Tab5_Arduino_latest]
extends=Tab5, option_release, pioarduino_latest
build_flags = ${Tab5.build_flags}
  ${option_release.build_flags}
build_src_filter = +<*> -<.git/> -<.svn/> +<../examples/UnitUnified/ViaPaHub>
lib_deps = ${Tab5.lib_deps}
  m5stack/M5Unit-HUB

[env:ViaPaHub_NessoN1_Arduino_latest]
extends=NessoN1, option_release, pioarduino_latest
build_src_filter = +<*> -<.git/> -<.svn/> +<../examples/UnitUnified/ViaPaHub>
lib_deps = ${NessoN1.lib_deps}
  m5stack/M5Unit-HUB
