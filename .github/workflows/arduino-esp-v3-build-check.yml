name: Build(arduino-esp32:3.x)

env:
  SKETCH_NAMES_FIND_START: ./examples/UnitUnified
  REQUIRED_LIBRARIES: M5Unified,M5UnitUnified
on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/arduino-esp-v3-build-check.yml'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/arduino-esp-v3-build-check.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.unit }}:${{ matrix.sketch }}:${{matrix.board}}@${{matrix.platform-version}}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        platform-url:
          - https://espressif.github.io/arduino-esp32/package_esp32_index.json

        sketch:
          - PlotToSerial
          - SimpleDisplay
          - SmoothDraw

        unit:
          - UnitNCIR
          - UnitNCIR2
          - UnitThermal2

        board:
          - arduino_nesso_n1
          - m5stack_atom
          - m5stack_atoms3
          - m5stack_capsule
          - m5stack_cardputer
          - m5stack_core
          - m5stack_core2
          - m5stack_coreink
          - m5stack_cores3
          - m5stack_dial
          - m5stack_dinmeter
          - m5stack_fire
          - m5stack_nanoc6
          - m5stack_paper
          - m5stack_stamp_s3
          - m5stack_stickc_plus
          - m5stack_stickc_plus2
          - m5stack_tab5

        platform-version:
          - 3.3.6

        platform:
          - esp32

        archi:
          - esp32

        exclude:
          # UnitNCIR has no SimpleDisplay/SmoothDraw examples
          - unit: UnitNCIR
            sketch: SimpleDisplay
          - unit: UnitNCIR
            sketch: SmoothDraw
          # UnitNCIR2 has no SmoothDraw example
          - unit: UnitNCIR2
            sketch: SmoothDraw
          # SimpleDisplay/SmoothDraw: Core only
          - board: arduino_nesso_n1
            sketch: SimpleDisplay
          - board: arduino_nesso_n1
            sketch: SmoothDraw
          - board: m5stack_atom
            sketch: SimpleDisplay
          - board: m5stack_atom
            sketch: SmoothDraw
          - board: m5stack_atoms3
            sketch: SimpleDisplay
          - board: m5stack_atoms3
            sketch: SmoothDraw
          - board: m5stack_capsule
            sketch: SimpleDisplay
          - board: m5stack_capsule
            sketch: SmoothDraw
          - board: m5stack_cardputer
            sketch: SimpleDisplay
          - board: m5stack_cardputer
            sketch: SmoothDraw
          - board: m5stack_core2
            sketch: SimpleDisplay
          - board: m5stack_core2
            sketch: SmoothDraw
          - board: m5stack_coreink
            sketch: SimpleDisplay
          - board: m5stack_coreink
            sketch: SmoothDraw
          - board: m5stack_cores3
            sketch: SimpleDisplay
          - board: m5stack_cores3
            sketch: SmoothDraw
          - board: m5stack_dial
            sketch: SimpleDisplay
          - board: m5stack_dial
            sketch: SmoothDraw
          - board: m5stack_dinmeter
            sketch: SimpleDisplay
          - board: m5stack_dinmeter
            sketch: SmoothDraw
          - board: m5stack_fire
            sketch: SimpleDisplay
          - board: m5stack_fire
            sketch: SmoothDraw
          - board: m5stack_nanoc6
            sketch: SimpleDisplay
          - board: m5stack_nanoc6
            sketch: SmoothDraw
          - board: m5stack_paper
            sketch: SimpleDisplay
          - board: m5stack_paper
            sketch: SmoothDraw
          - board: m5stack_stamp_s3
            sketch: SimpleDisplay
          - board: m5stack_stamp_s3
            sketch: SmoothDraw
          - board: m5stack_stickc_plus
            sketch: SimpleDisplay
          - board: m5stack_stickc_plus
            sketch: SmoothDraw
          - board: m5stack_stickc_plus2
            sketch: SimpleDisplay
          - board: m5stack_stickc_plus2
            sketch: SmoothDraw
          - board: m5stack_tab5
            sketch: SimpleDisplay
          - board: m5stack_tab5
            sketch: SmoothDraw

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build 
      - name: Compile examples
        uses: ArminJo/arduino-test-compile@master
        with:
          arduino-board-fqbn: ${{ matrix.platform }}:${{ matrix.archi }}:${{ matrix.board }}
          arduino-platform: ${{ matrix.platform }}:${{ matrix.archi }}@${{ matrix.platform-version }}
          platform-url: ${{ matrix.platform-url }}
          required-libraries: ${{ env.REQUIRED_LIBRARIES }}
          extra-arduino-cli-args: ${{ matrix.cli-args }}
          #build-properties: ${{ toJson(matrix.build-properties) }}
          sketch-names: ${{ matrix.sketch }}.ino
          sketch-names-find-start: ${{ env.SKETCH_NAMES_FIND_START }}/${{ matrix.unit }}
          #sketches-exclude: ${{ matrix.sketches-exclude }}
